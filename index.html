            [52300, 45400, 44400, 55400, 52800, 26400, null, null, null, 450, null, null, null, 22600, 12800, 10000,
                32200, 47400, 44400, 44800, null, 600, null, null, null, null
            ],
            [null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null,
                null, null, null, null, null, null, null, null, null
            ],
            [null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null,
                null, null, null, null, null, null, null, null, null
            ],
            [null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null,
                null, null, null, null, 6720, 3600, 4560, 4080, 2640, 2640
            ],
            [89500, 56100, 53200, 7450, 6300, null, null, null, null, null, null, null, null, null, null, null, null,
                null, null, null, null, null, null, null, null, null, null
            ],
            [null, null, null, null, null, null, 11000, null, null, null, null, null, null, null, null, null, null, null,
                null, null, null, null, null, null, null, null, null
            ],
            [null, null, null, 7700, 7900, null, null, null, null, null, null, null, null, null, null, null, null, null,
                null, null, null, null, null, null, null, null, null
            ],
            [22200, 9900, 3500, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null,
                null, 4500, 1500, null, 2100, 4200, 2100, null
            ]
        ];

        const allColumnKeys = [
            'DGL_Jan', 'DGL_Feb', 'DGL_Mar', 'DGL_Apr', 'DGL_May', 'DGL_Jun',
            'DRL_Jan', 'DRL_Feb', 'DRL_Mar', 'DRL_Apr', 'DRL_May', 'DRL_Jun', 'DRL_Jul',
            'DFL_Jan', 'DFL_Feb', 'DFL_Mar', 'DFL_Apr', 'DFL_May', 'DFL_Jun',
            'AFL_Jan', 'AFL_Feb', 'AFL_Mar', 'AFL_Apr', 'AFL_May', 'AFL_Jun', 'AFL_Jul',
            'GGL_Jan', 'GGL_Feb', 'GGL_Mar', 'GGL_Apr', 'GGL_May', 'GGL_Jun'
        ];
        const columnKeys = allColumnKeys.filter(key => !key.endsWith('_Jul'));

        const machineData = {};
        factories.forEach(f => { machineData[f] = {}; });

        for (let mIdx = 0; mIdx < machineNames.length; mIdx++) {
            const name = machineNames[mIdx];
            const qRow = quantityData[mIdx];
            const cRow = costData[mIdx];
            for (let colIdx = 0; colIdx < columnKeys.length; colIdx++) {
                const key = columnKeys[colIdx];
                const [fac, mon] = key.split('_');
                const q = (qRow[colIdx] !== undefined && qRow[colIdx] !== null) ? qRow[colIdx] : 0;
                const c = (cRow[colIdx] !== undefined && cRow[colIdx] !== null) ? cRow[colIdx] : 0;
                if (!machineData[fac][mon]) machineData[fac][mon] = {};
                machineData[fac][mon][name] = { quantity: q, cost: c };
            }
        }

        const monthSet = new Set();
        factories.forEach(f => Object.keys(machineData[f]).forEach(m => monthSet.add(m)));
        const monthList = Array.from(monthSet).sort((a, b) => {
            const order = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            return order.indexOf(a) - order.indexOf(b);
        });
        // --- END machine breakdown data ---

        // =========================================================================
        // 3. STATE
        // =========================================================================
        let currentFilter = 'all';
        let currentMode = 'actual';
        let currentView = 'summary';

        // =========================================================================
        // 4. SUMMARY CHART – now supports 4 years in Actual mode
        // =========================================================================
        const ctx = document.getElementById('revenueChart').getContext('2d');
        let summaryChart;

        function getDatasets(filter, mode) {
            // Helper: get data for a given year and filter
            function getYearData(yearData) {
                if (filter === 'all') {
                    return getTotals(yearData);
                } else {
                    return yearData[filter] || [];
                }
            }

            if (mode === 'projection') {
                // Only 2025 and 2026 projected
                const data25 = getYearData(y2025Padded);
                const data26 = getYearData(y2026Projected);
                return [{
                    label: '2025',
                    data: data25,
                    borderColor: '#2FD9C4',
                    backgroundColor: 'rgba(47,217,196,0.1)',
                    tension: 0.2,
                    pointRadius: 4,
                    pointBackgroundColor: '#2FD9C4',
                    spanGaps: false,
                    fill: false,
                }, {
                    label: '2026 (Projected)',
                    data: data26,
                    borderColor: '#F5B84D',
                    backgroundColor: 'rgba(245,184,77,0.1)',
                    tension: 0.2,
                    pointRadius: 4,
                    pointBackgroundColor: '#F5B84D',
                    spanGaps: false,
                    fill: false,
                    segment: {
                        borderDash: (ctx) => ctx.p0DataIndex >= 6 ? [6, 4] : []
                    },
                }];
            } else {
                // Actual mode: 2023, 2024, 2025, 2026
                const d23 = getYearData(y2023Padded);
                const d24 = getYearData(y2024Padded);
                const d25 = getYearData(y2025Padded);
                const d26 = getYearData(y2026Actual);
                return [{
                    label: '2023',
                    data: d23,
                    borderColor: '#8B93AA',
                    backgroundColor: 'rgba(139,147,170,0.1)',
                    tension: 0.2,
                    pointRadius: 3,
                    pointBackgroundColor: '#8B93AA',
                    spanGaps: false,
                    fill: false,
                }, {
                    label: '2024',
                    data: d24,
                    borderColor: '#6C5CE7',
                    backgroundColor: 'rgba(108,92,231,0.1)',
                    tension: 0.2,
                    pointRadius: 3,
                    pointBackgroundColor: '#6C5CE7',
                    spanGaps: false,
                    fill: false,
                }, {
                    label: '2025',
                    data: d25,
                    borderColor: '#2FD9C4',
                    backgroundColor: 'rgba(47,217,196,0.1)',
                    tension: 0.2,
                    pointRadius: 4,
                    pointBackgroundColor: '#2FD9C4',
                    spanGaps: false,
                    fill: false,
                }, {
                    label: '2026',
                    data: d26,
                    borderColor: '#F5B84D',
                    backgroundColor: 'rgba(245,184,77,0.1)',
                    tension: 0.2,
                    pointRadius: 4,
                    pointBackgroundColor: '#F5B84D',
                    spanGaps: false,
                    fill: false,
                }];
            }
        }

        function renderSummaryChart(filter, mode) {
            const datasets = getDatasets(filter, mode);
            if (summaryChart) summaryChart.destroy();
            Chart.register(ChartDataLabels);
            summaryChart = new Chart(ctx, {
                type: 'line',
                data: { labels: allMonths, datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { labels: { color: '#E7ECF7', font: { size: 12 } } },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    if (context.parsed.y === null) return null;
                                    let label = context.dataset.label || '';
                                    if (label) label += ': ';
                                    label += new Intl.NumberFormat('en-IN', {
                                        style: 'currency',
                                        currency: 'BDT',
                                        minimumFractionDigits: 0,
                                        maximumFractionDigits: 0
                                    }).format(context.parsed.y);
                                    return label;
                                }
                            }
                        },
                        datalabels: {
                            anchor: 'end',
                            align: 'end',
                            color: '#E7ECF7',
                            font: { size: 8, weight: 'bold' },
                            formatter: function(value) {
                                if (value === null || value === 0) return '';
                                return (value / 1000000).toFixed(1) + 'M';
                            },
                            offset: 1
                        }
                    },
                    scales: {
                        x: { ticks: { color: '#8B93AA' }, grid: { color: '#232B41' } },
                        y: {
                            ticks: {
                                color: '#8B93AA',
                                callback: value => 'BDT ' + (value / 1000000).toFixed(1) + 'M'
                            },
                            grid: { color: '#232B41' }
                        }
                    }
                },
                plugins: [ChartDataLabels]
            });

            // Update subtitle and note
            const sub = document.getElementById('chartSub');
            const note = document.getElementById('chartNote');
            if (mode === 'projection') {
                sub.textContent = '2025 vs 2026 (Projected: Jul–Dec = Jun)';
                note.textContent = filter === 'all' ?
                    'Showing total for all factories (projected)' :
                    `Showing data for ${filter} only (projected)`;
            } else {
                sub.textContent = '2023–2026 (Actual)';
                note.textContent = filter === 'all' ?
                    'Showing total for all factories (actual)' :
                    `Showing data for ${filter} only (actual)`;
            }
        }

        // =========================================================================
        // 5. SUMMARY CARDS (unchanged: compare 2025 vs 2026)
        // =========================================================================
        function updateSummary(filter, mode) {
            const container = document.getElementById('summaryStats');
            let sum2025, sum2026, label2025, label2026;
            if (mode === 'actual') {
                const indices = [0, 1, 2, 3, 4, 5]; // Jan–Jun
                if (filter === 'all') {
                    sum2025 = indices.reduce((a, i) => a + (total2025[i] || 0), 0);
                    sum2026 = indices.reduce((a, i) => a + (total2026Actual[i] || 0), 0);
                } else {
                    sum2025 = indices.reduce((a, i) => a + (y2025Padded[filter][i] || 0), 0);
                    sum2026 = indices.reduce((a, i) => a + (y2026Actual[filter][i] || 0), 0);
                }
                label2025 = '2025 Total (Jan–Jun)';
                label2026 = '2026 Actual (Jan–Jun)';
            } else {
                // projection: full year
                if (filter === 'all') {
                    sum2025 = total2025.reduce((a, v) => a + (v || 0), 0);
                    sum2026 = total2026Projected.reduce((a, v) => a + (v || 0), 0);
                } else {
                    sum2025 = y2025Padded[filter].reduce((a, v) => a + (v || 0), 0);
                    sum2026 = y2026Projected[filter].reduce((a, v) => a + (v || 0), 0);
                }
                label2025 = '2025 Total (Full Year)';
                label2026 = '2026 Projected (Full Year)';
            }
            const stdChange = ((sum2026 - sum2025) / sum2025) * 100;
            const displayedChange = -stdChange;
            let changeText, changeClass = 'neutral';
            if (displayedChange > 0) {
                changeText = '+' + displayedChange.toFixed(1) + '%';
                changeClass = 'positive';
            } else if (displayedChange < 0) {
                changeText = displayedChange.toFixed(1) + '%';
                changeClass = 'negative';
            } else {
                changeText = '0.0%';
                changeClass = 'neutral';
            }
            container.innerHTML = `
            <div class="stat-box"><div class="label">${label2025}</div><div class="value">BDT ${(sum2025/1000000).toFixed(2)}M</div></div>
            <div class="stat-box"><div class="label">${label2026}</div><div class="value amber">BDT ${(sum2026/1000000).toFixed(2)}M</div></div>
            <div class="stat-box"><div class="label">Change %</div><div class="value ${changeClass}">${changeText}</div></div>
          `;
        }

        // =========================================================================
        // 6. BREAKDOWN CHART (unchanged)
        // =========================================================================
        let breakdownChart = null;
        const breakdownCtx = document.getElementById('breakdownChart').getContext('2d');

        function getAggregatedData(monthFilter, factoryFilter) {
            const facList = (factoryFilter === 'all') ? factories : [factoryFilter];
            const monList = (monthFilter === 'all') ? monthList : [monthFilter];
            const result = {};
            machineNames.forEach(name => { result[name] = { quantity: 0, cost: 0 }; });
            facList.forEach(fac => {
                monList.forEach(mon => {
                    const data = machineData[fac] && machineData[fac][mon] ? machineData[fac][mon] : {};
                    machineNames.forEach(name => {
                        if (data[name]) {
                            result[name].quantity += data[name].quantity || 0;
                            result[name].cost += data[name].cost || 0;
                        }
                    });
                });
            });
            const filtered = {};
            Object.keys(result).forEach(name => {
                if (result[name].quantity !== 0 || result[name].cost !== 0) {
                    filtered[name] = result[name];
                }
            });
            return filtered;
        }

        function renderBreakdown(month, factory) {
            const data = getAggregatedData(month, factory);
            const machineNamesAll = Object.keys(data);
            const quantities = machineNamesAll.map(name => data[name].quantity);
            const costs = machineNamesAll.map(name => data[name].cost);

            if (breakdownChart) breakdownChart.destroy();
            Chart.register(ChartDataLabels);

            breakdownChart = new Chart(breakdownCtx, {
                type: 'bar',
                data: {
                    labels: machineNamesAll,
                    datasets: [{
                        label: 'Quantity',
                        data: quantities,
                        backgroundColor: 'rgba(47,217,196,0.7)',
                        borderColor: '#2FD9C4',
                        borderWidth: 1,
                        yAxisID: 'y',
                    }, {
                        label: 'Cost (BDT)',
                        data: costs,
                        backgroundColor: 'rgba(245,184,77,0.7)',
                        borderColor: '#F5B84D',
                        borderWidth: 1,
                        yAxisID: 'y1',
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { labels: { color: '#E7ECF7', font: { size: 12 } } },
                        datalabels: {
                            anchor: 'end',
                            align: 'end',
                            color: '#E7ECF7',
                            font: { size: 8, weight: 'normal' },
                            formatter: function(value, context) {
                                if (value === 0) return '';
                                if (context.datasetIndex === 1) {
                                    if (value >= 1000000) return (value / 1000000).toFixed(1) + 'M';
                                    else if (value >= 1000) return (value / 1000).toFixed(0) + 'k';
                                    else return value;
                                } else {
                                    return value;
                                }
                            },
                            offset: 0
                        }
                    },
                    scales: {
                        x: {
                            ticks: {
                                color: '#E7ECF7',
                                maxRotation: 90,
                                minRotation: 90,
                                font: { size: 11, weight: 'normal' }
                            },
                            grid: { color: '#232B41' }
                        },
                        y: {
                            type: 'linear',
                            display: true,
                            position: 'left',
                            ticks: { color: '#8B93AA' },
                            grid: { color: '#232B41' },
                            title: { display: true, text: 'Quantity', color: '#8B93AA' }
                        },
                        y1: {
                            type: 'linear',
                            display: true,
                            position: 'right',
                            ticks: {
                                color: '#8B93AA',
                                callback: function(value) {
                                    if (value >= 1000000) return (value / 1000000).toFixed(1) + 'M';
                                    else if (value >= 1000) return (value / 1000).toFixed(0) + 'k';
                                    else return value;
                                }
                            },
                            grid: { drawOnChartArea: false },
                            title: { display: true, text: 'Cost (BDT)', color: '#8B93AA' }
                        }
                    }
                },
                plugins: [ChartDataLabels]
            });
        }

        // =========================================================================
        // 7. VIEW SWITCHING & FILTERS
        // =========================================================================
        function setView(view) {
            currentView = view;
            const summaryDiv = document.getElementById('summaryView');
            const breakdownDiv = document.getElementById('breakdownView');
            if (view === 'summary') {
                summaryDiv.classList.remove('hidden');
                breakdownDiv.classList.add('hidden');
                renderSummaryChart(currentFilter, currentMode);
                updateSummary(currentFilter, currentMode);
            } else {
                summaryDiv.classList.add('hidden');
                breakdownDiv.classList.remove('hidden');
                if (!breakdownDiv.dataset.initialized) {
                    populateBreakdownFilters();
                    breakdownDiv.dataset.initialized = true;
                } else {
                    const month = document.getElementById('monthFilter').value;
                    const factory = document.getElementById('factoryFilter').value;
                    renderBreakdown(month, factory);
                }
            }
            document.querySelectorAll('.view-btn').forEach(b => {
                b.classList.toggle('active', b.dataset.view === view);
            });
        }

        // ── Summary factory dropdown ──
        function populateSummaryFactoryFilter() {
            const sel = document.getElementById('summaryFactoryFilter');
            sel.innerHTML = '';
            const allOpt = document.createElement('option');
            allOpt.value = 'all';
            allOpt.textContent = 'All';
            sel.appendChild(allOpt);
            factories.forEach(f => {
                const opt = document.createElement('option');
                opt.value = f;
                opt.textContent = f;
                sel.appendChild(opt);
            });
            sel.value = 'all';
            sel.addEventListener('change', function() {
                currentFilter = this.value;
                if (currentView === 'summary') {
                    renderSummaryChart(currentFilter, currentMode);
                    updateSummary(currentFilter, currentMode);
                }
            });
        }

        // ── Breakdown filters ──
        function populateBreakdownFilters() {
            const monthSelect = document.getElementById('monthFilter');
            const factorySelect = document.getElementById('factoryFilter');

            monthSelect.innerHTML = '';
            const allMonthOpt = document.createElement('option');
            allMonthOpt.value = 'all';
            allMonthOpt.textContent = 'All';
            monthSelect.appendChild(allMonthOpt);
            monthList.forEach(m => {
                const opt = document.createElement('option');
                opt.value = m;
                opt.textContent = m;
                monthSelect.appendChild(opt);
            });

            factorySelect.innerHTML = '';
            const allFacOpt = document.createElement('option');
            allFacOpt.value = 'all';
            allFacOpt.textContent = 'All';
            factorySelect.appendChild(allFacOpt);
            factories.forEach(f => {
                const opt = document.createElement('option');
                opt.value = f;
                opt.textContent = f;
                factorySelect.appendChild(opt);
            });

            monthSelect.value = 'all';
            factorySelect.value = 'all';

            monthSelect.onchange = () => {
                renderBreakdown(monthSelect.value, factorySelect.value);
            };
            factorySelect.onchange = () => {
                renderBreakdown(monthSelect.value, factorySelect.value);
            };

            renderBreakdown('all', 'all');
        }

        // =========================================================================
        // 8. EVENT BINDINGS
        // =========================================================================
        document.querySelectorAll('.view-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                setView(this.dataset.view);
            });
        });

        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentMode = this.dataset.mode;
                if (currentView === 'summary') {
                    renderSummaryChart(currentFilter, currentMode);
                    updateSummary(currentFilter, currentMode);
                }
            });
        });

        // =========================================================================
        // 9. INIT
        // =========================================================================
        populateSummaryFactoryFilter();
        setView('summary');
    </script>
</body>
</html>
